<p class="lead">請依你在系統裡的角色，選一份手冊。每份都有「快速指引」和「完整說明」兩部分。</p>
<a class="role" href="staff.html"><b>一般同仁</b><span>護理師與各單位同仁：報修、看進度、補照片、撤回</span></a>

<p class="meta" style="margin-top:24px">不知道自己是哪個角色？打開系統，右上角名字旁有寫「總務」或「主任」；沒寫就是一般同仁。</p>
